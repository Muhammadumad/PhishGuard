services:
  # ── Django Backend API Web Service ───────────────────────────────────────────
  - type: web
    name: phishguard-backend
    env: python
    rootDir: phishguard-backend
    healthCheckPath: /health/
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --config gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://phish-guard-git-main-umad-tech.vercel.app,https://phishguard033-g2im.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://phishguard-api-g2df.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  # ── Celery Background Worker Service ─────────────────────────────────────────
  - type: worker
    name: phishguard-celery-worker
    env: python
    rootDir: phishguard-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A core worker --loglevel=info"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: phishguard-backend
          property: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: phishguard-backend
          property: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: phishguard-backend
          property: REDIS_URL
