services:
  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: phishguard_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-phishguard_db}
      MYSQL_USER: ${DB_USER:-phishguard_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-phishguard_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-phishguard_root_secret_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Broker ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: phishguard_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend (Gunicorn WSGI) ───────────────────────────────────────
  backend:
    build:
      context: ./phishguard-backend
      dockerfile: Dockerfile
    container_name: phishguard_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-this-in-production-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web}
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=${DB_NAME:-phishguard_db}
      - DB_USER=${DB_USER:-phishguard_user}
      - DB_PASSWORD=${DB_PASSWORD:-phishguard_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=3306
      - USE_REDIS_CACHE=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    volumes:
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --config gunicorn.conf.py core.wsgi:application"

  # ── Celery Worker (Async Task Queue Process) ─────────────────────────────
  celery_worker:
    build:
      context: ./phishguard-backend
      dockerfile: Dockerfile
    container_name: phishguard_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-this-in-production-2026}
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=${DB_NAME:-phishguard_db}
      - DB_USER=${DB_USER:-phishguard_user}
      - DB_PASSWORD=${DB_PASSWORD:-phishguard_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=3306
      - USE_REDIS_CACHE=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
    volumes:
      - backend_logs:/app/logs
    command: celery -A core worker --loglevel=info --concurrency=4

  # ── Celery Beat (Scheduled Periodic Tasks Engine) ─────────────────────────
  celery_beat:
    build:
      context: ./phishguard-backend
      dockerfile: Dockerfile
    container_name: phishguard_celery_beat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-this-in-production-2026}
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=${DB_NAME:-phishguard_db}
      - DB_USER=${DB_USER:-phishguard_user}
      - DB_PASSWORD=${DB_PASSWORD:-phishguard_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=3306
      - USE_REDIS_CACHE=True
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
    volumes:
      - backend_logs:/app/logs
    command: celery -A core beat --loglevel=info

  # ── React Frontend (Nginx Production Server) ─────────────────────────────
  web:
    build:
      context: ./phishguard-frontend
      dockerfile: Dockerfile
    container_name: phishguard_frontend
    restart: always
    depends_on:
      - backend
      - celery_worker
    ports:
      - "80:80"

volumes:
  mysql_data:
  redis_data:
  backend_static:
  backend_logs:
